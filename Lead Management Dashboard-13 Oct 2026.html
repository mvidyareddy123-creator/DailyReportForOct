<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Daily Lead Management Dashboard - 13 Oct 2026</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#e4e7ec;--c0:#c9ced6;--c1:#f59e0b;--c2:#3b82f6;--c3:#f97316;--c4:#16a34a;--c5:#94a3b8;--c6:#475569;--ac:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0f1419;--card:#18202a;--tx:#e8edf3;--mu:#98a2b3;--bd:#2a3441;--c0:#4b5563;--ac:#2dd4bf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:20px 16px 40px}h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--mu);margin:2px 0 18px}
.g{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;min-width:0}.kv{font-size:28px;font-weight:700}.kl{color:var(--mu);font-size:12px}
.row{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.bar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--bd)}.bar i{display:block}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu);margin-bottom:8px}.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px}td.n,th.n{text-align:right}
.hot{color:var(--c4);font-weight:600}.warn{color:#dc2626;font-weight:600}ul{margin:0;padding-left:18px}li{margin:5px 0}.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--bd)}
</style></head><body><div class="w">

<div class="g k" id="kpi"></div>

</div><script>

", 9, 9], ["Nagendra Y", "Kakinada", 9, 8], ["Siva Reddy", "Vijayawada", 9, 8], ["Maria Angel", "Mysore", 7, 7], ["Yasmin Nihara", "Madurai", 7, 7], ["Pavani B", "Kakinada", 8, 6], ["Mathumitha Srri", "Madurai", 6, 6]], "st": ["Lead", "Call Back", "Follow Up", "Warm Lead", "Hot Lead", "Cold Lead", "Dead Lead"]},ST=D.st,CL=['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
const tot=233,un=166,wk=tot-un,get=n=>D.R.reduce((a,r)=>a+r[1+ST.indexOf(n)],0);
const K=[['Total leads',tot,''],['Worked',wk,(wk/tot*100).toFixed(0)+'% of leads'],['Untouched',un,(un/tot*100).toFixed(0)+'% still at "Lead"'],['Call Back',get('Call Back'),'not reached'],['Follow Up',get('Follow Up'),''],['Hot + Warm',get('Hot Lead')+get('Warm Lead'),get('Hot Lead')+' hot, '+get('Warm Lead')+' warm'],['Cold + Dead',get('Cold Lead')+get('Dead Lead'),'']];
kpi.innerHTML=K.map(k=>`<div class="c"><div class="kl">${k[0]}</div><div class="kv">${k[1]}</div><div class="kl">${k[2]}&nbsp;</div></div>`).join('');
const mx=Math.max(...ST.map(get));
stage.innerHTML=ST.map((s,i)=>`<div class="row"><span>${s==='Lead'?'Lead (untouched)':s}</span><div class="bar"><i style="width:${get(s)/mx*100}%;background:${CL[i]}"></i></div><b>${get(s)}</b></div>`).join('');
const leg=(el)=>el.innerHTML=ST.map((s,i)=>`<span><b style="background:${CL[i]}"></b>${s==='Lead'?'Untouched':s}</span>`).join('');leg(leg1);leg(leg2);
const stack=(rows,el)=>{const m=Math.max(...rows.map(r=>r[8]));el.innerHTML=rows.map(r=>{const w=r[8]-r[1];return `<div class="row"><span>${r[0]}</span><div class="bar" style="width:${r[8]/m*100}%;min-width:30px">${ST.map((s,i)=>r[1+i]?`<i title="${s}: ${r[1+i]}" style="width:${r[1+i]/r[8]*100}%;background:${CL[i]}"></i>`:'').join('')}</div><b>${r[8]}</b></div>`}).join('')};
stack(D.R,reg);stack(D.B,br);
const pc=(a,b)=>(a/b*100).toFixed(0)+'%';
src.innerHTML='<tr><th>Source</th><th class="n">Leads</th><th class="n">Worked</th><th class="n">Worked %</th><th class="n">Hot/Warm</th></tr>'+D.S.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[8]}</td><td class="n">${r[8]-r[1]}</td><td class="n">${pc(r[8]-r[1],r[8])}</td><td class="n">${r[4]+r[5]}</td></tr>`).join('');
adv.innerHTML='<tr><th>Advisor</th><th>Branch</th><th class="n">Leads</th><th class="n">Untouched</th></tr>'+D.O.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td><td class="n warn">${r[3]}</td></tr>`).join('');
const H=[['Hot','Naveena Shanmugham','Coimbatore','Will pay token on Thursday (3 entries logged within 2 minutes, likely one prospect)'],['Warm','Anjali Manohar','Thrissur-MG Road','Client referral; CVs shared, family discussing'],['Warm','Sweatha H S','Hubli','Age 40, ready to pay consultancy; branch visit on 14th'],['Warm','Sweatha H S','Mysore','Age 27, UK master\'s, wants Europe; branch visit 11:30am, ready to pay consultancy'],['Warm','Sweatha H S','Mysore','Branch visit on 19th; CV to follow']];
hw.innerHTML='<tr><th>Stage</th><th>Advisor</th><th>Branch</th><th>Latest note</th></tr>'+H.map(r=>`<tr><td class="${r[0]==='Hot'?'hot':''}">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td style="white-space:normal">${r[3]}</td></tr>`).join('');
ins.innerHTML=['<b>71% of the day\'s leads (166 of 233) were still untouched</b>, as most leads are received after the team\'s working hours.','<b>Tamil Nadu 17% worked, AP / TS 25%, Karnataka 34%.</b> Vijayawada (36 of 39), Madurai (15 of 15), Kakinada (23 of 28) and Chennai (13 of 15) are the biggest backlogs.','<b>21 of 54 advisors worked none of their leads</b> (84 leads between them), including three advisors holding 9 leads each (two at Vijayawada, one at Coimbatore).','<b>Call Back is 46% of worked leads (31 of 67).</b> AP / TS holds 19 of them: Vizag 6, Hyderabad 5, Nellore 4.','<b>Direct / referral leads convert far better:</b> 94% worked and all 3 hot leads, vs 24% worked and no hot leads from Facebook forms (216 leads).','<b>12 cold / dead leads:</b> 4 have a local job, a business or want jobs in India, 4 are not interested, 3 are junk (form by mistake, invalid number, advertiser enquiry), 1 is planning for later.'].map(x=>`<li>${x}</li>`).join('');
act.innerHTML=['Clear the 166 untouched leads by noon, starting with Vijayawada, Kakinada, Hyderabad, Madurai, Chennai, Mysore and Bangalore.','Re-dial all 31 Call Back leads in two attempts, and send a WhatsApp message to those not answering.','Close the Coimbatore token (Thursday) and confirm the 14th, 11:30am and 19th branch visits.','Set a first-call SLA for the evening lead surge and rebalance leads away from advisors with no activity.','Review Facebook form screening to filter out local-job and "jobs in India" enquirers.','Mangalore did not receive any leads, so check whether its campaign is still running, even with very low spend, as per the Karnataka manager\'s request.'].map(x=>`<li>${x}</li>`).join('');
</script></body></html>
